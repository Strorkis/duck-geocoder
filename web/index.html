<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>duck-geocoder demo</title>
  </head>
  <body>
    <div id="app">
      <div id="search-panel">
        <div id="search-row">
          <div id="search-box">
            <input
              id="search-input"
              type="text"
              placeholder="市区町村・地名で検索 (例: 港区)"
              autocomplete="off"
              disabled
            />
            <button id="clear-button" type="button" title="クリア" hidden>×</button>
          </div>
          <!-- 逆ジオコーディングは押したときだけ効かせる。常時オンだと、建物を
               眺めている最中のクリックで行政区域の全体まで引き戻されてしまう。 -->
          <button
            id="pick-location"
            type="button"
            aria-pressed="false"
            title="押してから地図をクリックすると、その地点の市区町村を判定します (Escで解除)"
            disabled
          >
            📍
          </button>
        </div>
        <ul id="results"></ul>
        <!-- 背景地図は検索欄の下。地理院地図と同じ位置で、データのレイヤーとは
             性格が違う (下敷きであって、探しているデータではない)。 -->
        <details id="map-section">
          <summary>地図</summary>
          <div class="field">
            <label for="basemap">種類</label>
            <select id="basemap"></select>
          </div>
        </details>
      </div>
      <div id="map"></div>
      <!-- 初期化が終わったあとの待ち時間を知らせる。初期化のオーバーレイ (#loading) と
           違って操作は妨げない。四隅は埋まっているので上端中央に置く。 -->
      <div id="busy" hidden>
        <div class="spinner small"></div>
        <span id="busy-label"></span>
      </div>
      <!--
        できることは1枚にまとめ、中身はたたんでおく。四隅に散らしていたときは
        初見で何から触ればいいか分からなかった。**見出しは畳まない**ので、
        「何ができるか」は開かなくても読める。
        開閉にJavaScriptが要らないので details を使う。
      -->
      <!--
        データは左下、使い方と出典は右下に分ける。

        **右下はMapLibreの出典表示 (ⓘ) の場所**で、そこにデータのパネルを重ねると
        出典に押し上げられる (実測で出典が2行になったときに「建物のある範囲へ移動」が
        押せなくなった)。よく触るデータを衝突しない左下へ移し、出典と同じ性格の
        「使い方・出典」だけを右下に残す。
      -->
      <div id="data-panel">
        <!--
          データは**レイヤーの一覧**にする。種別ごとに節を積むと、オープンデータを
          足すたびに縦へ伸びて頭打ちが無い。一覧は1データ1行で、設定は
          **パネルの中身を入れ替えて**出す (地図を隠さず、縦にも伸びない)。
        -->
        <div id="layer-view">
          <div id="layer-list">
            <p class="layer-heading">この場所のデータ</p>
            <div id="layer-rows"></div>
            <!-- 収録が無いものも出す。「無い」と分かるのも情報なので隠さない。 -->
            <div id="layer-absent" hidden>
              <p class="layer-heading">この範囲には無い</p>
              <div id="layer-absent-rows"></div>
            </div>
            <!-- 検索と逆ジオコーディングが使っているもの。**切れてはいけない**
                 (外すと検索が壊れる) ので、チェックボックスは出さない。 -->
            <div id="layer-support" hidden>
              <p class="layer-heading">検索に使用</p>
              <div id="layer-support-rows"></div>
            </div>
          </div>
          <div id="layer-settings" hidden>
            <button id="layer-back" type="button">← 一覧へ</button>
            <p id="layer-settings-title"></p>
            <div id="layer-settings-body"></div>
          </div>
        </div>
        <!-- 建物の設定。レイヤー一覧から開かれたときに #layer-settings-body へ移す。 -->
        <div id="buildings-section" hidden>
          <!-- 建物は一部の範囲しか収録していない。偶然そこへ行かないと
               機能があること自体に気づけないので、移動する手段を置く。
               データが無いときはJavaScript側で隠したままにする。 -->
          <button id="goto-buildings" type="button" hidden>建物のある範囲へ移動</button>
          <div class="field">
            <label for="building-source">建物データ</label>
            <select id="building-source"></select>
          </div>
          <!-- 収録範囲の枠。建物が出ないズームでどこにデータがあるかを示すためのもので、
               収録範囲が広がれば要らなくなる。切れるようにしておく。 -->
          <div class="field">
            <label class="toggle">
              <input id="coverage-toggle" type="checkbox" checked />
              収録範囲を枠で示す
            </label>
          </div>
          <!-- 絞り込みは属性が揃っている出所 (PLATEAU) でだけ出す。 -->
          <div id="building-filters" hidden>
            <div class="field" id="height-field">
              <label for="min-height">高さ <output id="min-height-value">0 m</output> 以上</label>
              <input id="min-height" type="range" min="0" max="200" step="5" value="0" />
            </div>
            <div class="field" id="usage-field">
              <!-- 1つだけ見たいときに全部外させないための一括操作。 -->
              <label
                >用途
                <span class="bulk">
                  <button id="usage-all" type="button">すべて</button>
                  <button id="usage-none" type="button">なし</button>
                </span>
              </label>
              <div id="usage-options"></div>
            </div>
          </div>
          <!-- 絞り込みの外に置く。中に入れると、絞り込める列を持たない出所を
               選んだときに件数ごと消えてしまう。 -->
          <p id="building-count" class="note"></p>
        </div>
        <!-- 地上リスク (SORAのiGRC)。表示の切り替えは一覧のチェックボックスが持つ。 -->
        <div id="mesh-section" hidden>
          <div id="mesh-controls">
            <div class="field">
              <label for="aircraft-class">機体 (最大寸法 / 最大速度)</label>
              <select id="aircraft-class"></select>
            </div>
            <!-- 凡例は色の段と iGRC の対応を示す。色だけでは「濃い/薄い」しか
                 読めないので、判断に使う数値を併記する。 -->
            <table id="mesh-legend">
              <thead>
                <tr><th>人口密度 (人/km²)</th><th>iGRC</th></tr>
              </thead>
              <tbody></tbody>
            </table>
            <p id="mesh-summary" class="note"></p>
          </div>
        </div>
        <div id="railway-section" hidden>
          <div id="railway-controls">
            <!-- 事業者種別で絞る。選択肢はカタログの語彙から作るので、
                 出所が増えてもここに書き足さなくてよい。 -->
            <div class="field">
              <label>
                事業者種別
                <span class="bulk">
                  <button id="railway-all" type="button">全部</button>
                  <button id="railway-none" type="button">解除</button>
                </span>
              </label>
              <div id="railway-types"></div>
            </div>
            <p id="railway-summary" class="note"></p>
          </div>
        </div>
      </div>
      <!-- 使い方と出典。**出典と同じ性格のもの**なので、MapLibreの ⓘ と同じ右下に置く。 -->
      <div id="info-panel">
        <details id="help">
          <summary>使い方</summary>
          <ul>
            <li>市区町村や地名を<b>検索</b>すると、その場所へ移動します</li>
            <li><b>📍</b> を押してから地図を<b>クリック</b>すると、その地点の市区町村を判定します</li>
            <li>建物に<b>カーソルを合わせる</b>と、名称と用途が出ます (拡大したとき)</li>
            <li>判定した結果は、<b>×</b> か <b>Esc</b> で消せます</li>
          </ul>
        </details>
        <!-- 出典は地図右下の ⓘ にも出るが、そちらは1行に詰まって読みにくい
             (MapLibreが出典の間を " | " のテキストで繋ぐため)。
             何のデータの出典かを読めるようにここにも出す。 -->
        <details id="credits-section">
          <summary>出典</summary>
          <dl id="credits"></dl>
        </details>
      </div>
      <div id="loading">
        <div class="spinner"></div>
        <p id="loading-message">読み込み中…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
