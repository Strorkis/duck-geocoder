name: Deploy to GitHub Pages

# アプリとDuckDB-WASM本体を GitHub Pages に載せる。
# GeoParquetはここには含めない (Cloudflare R2 に置き、URLを VITE_DATA_BASE_URL で渡す)。
#
# WASMは35〜40MBあるのでgitには入れていない。ビルド時に node_modules から
# dist/duckdb/ にコピーされ (web/vite.config.ts の copy-duckdb-runtime)、
# Pagesのアーティファクトとしてアップロードされる。
#
# デプロイ前に本番ビルドに対してE2Eを流す。MapLibreのワーカーがビルド成果物に
# 含まれず、公開してからGeoJSONが一切描画されない状態になったことがあり、
# 開発サーバーでは再現しなかったため。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。実行中のデプロイは中断しない (公開中のサイトを壊さないため)。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # Node.js 20 で動くアクションは非推奨になっているので、
      # Node.js 24 で動くメジャーバージョンを使う。
      - uses: actions/checkout@v7

      # package.json に packageManager を書いていないので、ここでメジャーを指定する
      # (mise.toml 側は pnpm = "latest" なので、細かく固定しすぎない)。
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      # v6以降、packageManager を見た自動キャッシュはnpmだけになったが、
      # ここでは cache を明示しているので pnpm でも効く。
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # spatial/parquet拡張 (DuckDB本体と同じく自前配信にしてある。
      # web/duckdb-extensions.ts を参照)。DuckDBのバージョンは
      # duckdb-wasm (pnpm-lock.yaml) に紐づくので、それをキーにする。
      # 無ければ vite build 時に取得されるが、キャッシュがあれば約47MBの
      # ダウンロードを毎回省ける。
      - uses: actions/cache@v4
        with:
          path: web/.duckdb-extensions
          key: duckdb-extensions-${{ hashFiles('web/pnpm-lock.yaml') }}

      - run: pnpm exec tsc --noEmit

      # 未設定のままだとデータのURLが空でビルドされ、E2Eは「データが無い」と
      # 判断して全件スキップする。テストが素通りしたまま壊れたものが公開されるので、
      # ここで止める。
      - name: データの配信先が設定されているか確認
        run: |
          test -n "${{ vars.DATA_BASE_URL }}" || {
            echo "リポジトリ変数 DATA_BASE_URL が未設定です" >&2
            exit 1
          }

      - run: pnpm exec playwright install --with-deps chromium

      # ビルドしてから、その成果物に対してE2Eを流す (test:dist が両方を行う)。
      # ここを通ったものだけをアップロードするので、テストが落ちればデプロイされない。
      #
      # データは公開中のオブジェクトストレージから読む。配信側のCORSとRangeの設定も
      # 一緒に検証されるが、そのぶん初期化に往復の遅延が乗るので5分ほどかかる。
      # オブジェクトストレージ側で localhost:4173 (vite preview) を
      # AllowedOrigins に含めておくこと。
      - run: pnpm test:dist
        env:
          # リポジトリ名のサブパスで配信されるため。
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # データの置き場所。リポジトリの Variables で設定する。
          VITE_DATA_BASE_URL: ${{ vars.DATA_BASE_URL }}

      # ヘッドレスでの失敗はログだけでは追いにくいので、トレースを残す。
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-trace
          path: web/test-results/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
